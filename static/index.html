<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<meta name="color-scheme" content="light">
<title>Agents Test AI Platform</title>
<link rel="icon" href="img/logo.png">
<!-- The display face is asked for before the stylesheet has been parsed, so the
     first heading is set in it rather than being reset a moment later. -->
<link rel="preload" href="fonts/playfair-display-latin.woff2" as="font"
      type="font/woff2" crossorigin>
<link rel="stylesheet" href="css/app.css">
</head>
<body>

<!-- Replaced by the application once React has mounted. If it never mounts,
     this is what stays on screen, so it has to say something useful. -->
<div id="root">
  <div class="boot">
    <img class="boot__logo" src="img/logo.png" alt="PwC">
    <p class="boot__note">Loading</p>
  </div>
</div>

<script src="js/vendor/react.production.min.js"></script>
<script src="js/vendor/react-dom.production.min.js"></script>
<script src="js/app.js"></script>

</body>
</html>
